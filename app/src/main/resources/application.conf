ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ me.nathanfallet.asonar.ApplicationKt.module ]
    }
    environment = "localhost"
    environment = ${?KTOR_ENV}
}
# Default: a zero-config local H2 file database under ./data (gitignored), so asonar boots and keeps
# its keyword history with no external server. Switch protocol to "mysql" and set the host/user/
# password to run against a real server instead.
database {
    protocol = "h2"
    protocol = ${?DB_PROTOCOL}
    host = "./data"
    host = ${?DB_HOST}
    name = "asonar"
    name = ${?DB_NAME}
    user = "root"
    user = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
}
