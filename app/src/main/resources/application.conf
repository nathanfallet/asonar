ktor {
    deployment {
        port = 8080
        port = ${?ASONAR_PORT}
    }
    application {
        modules = [ me.nathanfallet.asonar.ApplicationKt.module ]
    }
    environment = "localhost"
    environment = ${?ASONAR_ENV}
}
# Default: a zero-config local H2 file database under ./data (gitignored), so asonar boots and keeps
# its keyword history with no external server. Switch protocol to "mysql" and set host/user/password
# to run against a real server instead. Env vars are namespaced ASONAR_* so they never collide with
# generic DB_* variables that may already be set in the shell.
database {
    protocol = "h2"
    protocol = ${?ASONAR_DB_PROTOCOL}
    directory = "./data"
    directory = ${?ASONAR_DB_DIR}
    name = "asonar"
    name = ${?ASONAR_DB_NAME}
    host = "localhost"
    host = ${?ASONAR_DB_HOST}
    user = "root"
    user = ${?ASONAR_DB_USER}
    password = ""
    password = ${?ASONAR_DB_PASSWORD}
}
