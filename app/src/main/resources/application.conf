ktor {
    deployment {
        port = 8080
        port = ${?ASONAR_PORT}
    }
    application {
        modules = [ me.nathanfallet.asonar.ApplicationKt.module ]
    }
    environment = "localhost"
    environment = ${?ASONAR_ENV}
}
# Real MySQL + RabbitMQ, brought up by `docker compose up -d` (see compose.yaml). Env vars are
# namespaced ASONAR_* so they never collide with generic DB_*/RABBITMQ_* set in the shell. Switch
# `database.protocol` to "h2" (with a `database.directory`) for a no-server local run.
database {
    protocol = "mysql"
    protocol = ${?ASONAR_DB_PROTOCOL}
    name = "asonar"
    name = ${?ASONAR_DB_NAME}
    directory = "./data"
    directory = ${?ASONAR_DB_DIR}
    host = "localhost"
    host = ${?ASONAR_DB_HOST}
    port = "3306"
    port = ${?ASONAR_DB_PORT}
    user = "root"
    user = ${?ASONAR_DB_USER}
    password = ""
    password = ${?ASONAR_DB_PASSWORD}
}
rabbitmq {
    host = "localhost"
    host = ${?ASONAR_RABBITMQ_HOST}
    port = "5672"
    port = ${?ASONAR_RABBITMQ_PORT}
    user = "guest"
    user = ${?ASONAR_RABBITMQ_USER}
    password = "guest"
    password = ${?ASONAR_RABBITMQ_PASSWORD}
}
# Apple Search Ads scraping (keyword popularity) via kdriver. Log in once by hand in the persistent
# Chrome profile (the window that opens on the first fetch). adamId is only a context — any cataloged
# app works (this is NutriMaxing's).
asa {
    adamId = "6779967120"
    adamId = ${?ASONAR_ASA_ADAM_ID}
    profileDir = "./data/appads-profile"
    profileDir = ${?ASONAR_ASA_PROFILE_DIR}
    baseUrl = "https://app-ads.apple.com"
    baseUrl = ${?ASONAR_ASA_BASE_URL}
    graphqlEndpoint = "https://app-ads.apple.com/booking/graphql"
    graphqlEndpoint = ${?ASONAR_ASA_GRAPHQL_ENDPOINT}
}
