# Configuration for ApplicationTest: the real module on an in-memory H2. The `test` environment never
# starts RabbitMQ (see configureMessageBroker), so no broker is needed and none is health-checked.
ktor {
    application {
        modules = []
    }
    environment = "test"
}
database {
    protocol = "h2"
    name = "asonar-test"
    directory = ""
    host = ""
    port = ""
    user = ""
    password = ""
}
rabbitmq {
    host = "localhost"
    port = "5672"
    user = "guest"
    password = "guest"
}
asa {
    adamId = "0"
    profileDir = "./build/test-asa-profile"
    baseUrl = "https://app-ads.apple.com"
    graphqlEndpoint = "https://app-ads.apple.com/booking/graphql"
}
